name: CI

on:
  push:
    branches: [feature/model-b-pricing, feature/market-pricing-intelligence]
  pull_request:
    branches: [staging-integration]

jobs:
  model-b:
    name: Typecheck + Model B tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript compile (whole branch)
        run: npx tsc --noEmit
      - name: Model B unit tests (pricing, payouts, labor-only, classification)
        run: npx vitest run tests/junk tests/labor
      - name: Full test suite (informational — some suites need app env/DB)
        run: npx vitest run
        continue-on-error: true
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

  junk-db:
    name: DB integration (price approval)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tempmovers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tempmovers_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
      - name: Price-approval DB integration tests (transaction, rollback, concurrency, cross-market, policy)
        run: npx vitest run tests/junk-db
